<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy League Analyzer</title><style>
:root{--bg:#091121;--panel:#111c30;--line:#293b5b;--text:#f4f7ff;--muted:#9ba8bd;--blue:#72aefe;--green:#65d6a4;--yellow:#f0b95d;--red:#ff7186}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080e1d,#0b1425);color:var(--text);font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;gap:16px}.back{color:#a8cfff;text-decoration:none;font-weight:800}select,input,textarea,button{font:inherit;color:var(--text);background:#0d1729;border:1px solid var(--line);border-radius:11px;padding:12px}button{font-weight:850;cursor:pointer;background:#183256;border-color:#4c8bd8}h1{font-size:clamp(34px,6vw,66px);margin:34px 0 8px}.sub,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:7px}.field>*{width:100%}.actions{display:flex;gap:10px;align-items:end}.status{margin-top:14px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}tr.selected{background:#203654}.score{font-size:22px;font-weight:900}.details{display:grid;grid-template-columns:1fr 1fr;gap:20px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center}.track{height:12px;border-radius:9px;background:#24324a;overflow:hidden}.fill{height:100%;border-radius:9px;background:var(--blue)}.fill.good{background:var(--green)}.fill.bad{background:var(--red)}.pill{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:20px;margin:4px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid,.details{grid-template-columns:1fr}.top{align-items:flex-start}.barrow{grid-template-columns:70px 1fr 40px}table{font-size:14px}th,td{padding:10px 6px}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html">← All tools</a><select id="nav"><option>📊 League Analyzer</option><option value="index.html">🏠 Home</option><option value="analyzer.html">⚖️ Trade Analyzer</option><option value="generator.html">🔁 Trade Generator</option><option value="target.html">🎯 Target Finder</option><option value="tradefinder.html">🔄 Trade Block</option><option value="waiver.html">➕ Waivers</option><option value="startsit.html">🧠 Start / Sit</option></select></div><h1>League Analyzer 📊</h1><p class="sub">Power-rank every roster, then see exactly where your team ranks by position and starting slot.</p>
<section class="card"><h2>1. Load your league</h2><div class="grid"><div class="field"><label>Import source</label><select id="source"><option value="sleeper">Sleeper</option><option value="manual">Manual rosters</option></select></div><div class="field"><label>Sleeper league ID</label><input id="leagueId" placeholder="Paste league ID"></div><div class="actions"><button id="load">Analyze league</button></div></div><div class="field" id="manualBox" hidden><label>One team per line</label><textarea id="manual" rows="5" placeholder="Team A: Player One, Player Two&#10;Team B: Player Three, Player Four"></textarea></div><div id="status" class="status">Import a league to begin.</div></section>
<section id="results" class="card"><div class="empty">League power rankings will appear here.</div></section><iframe id="engine" src="target.html" hidden></iframe></div><script>
const $=x=>document.getElementById(x),norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');let db={},teams={},slots=['QB','RB1','RB2','WR1','WR2','TE','FLEX1','FLEX2'];$('nav').onchange=e=>{if(e.target.value)location.href=e.target.value};$('source').onchange=()=>{$('manualBox').hidden=$('source').value!=='manual';$('leagueId').closest('.field').hidden=$('source').value==='manual'};
function getDB(){const w=$('engine').contentWindow;try{db=w.eval('DB');return!!db}catch{return false}}function canon(name){const n=norm(name),keys=Object.keys(db);return keys.find(k=>norm(k)===n)||keys.find(k=>norm(k.replace(/\s+(jr|sr|ii|iii|iv|v)\.?$/i,''))===n)||null}function best(list,pos,n){return list.filter(x=>db[x]?.pos===pos).sort((a,b)=>db[b].v-db[a].v).slice(0,n)}function lineup(roster){let left=roster.filter(x=>db[x]),used=[],out={};for(const [p,n]of[['QB',1],['RB',2],['WR',2],['TE',1]])best(left,p,n).forEach((x,i)=>{used.push(x);out[p+(n>1?i+1:'')]=x});left=left.filter(x=>!used.includes(x)).sort((a,b)=>db[b].v-db[a].v);left.slice(0,2).forEach((x,i)=>{out['FLEX'+(i+1)]=x;used.push(x)});return{out,used,starter:used.reduce((s,x)=>s+db[x].v,0),bench:roster.filter(x=>db[x]&&!used.includes(x)).sort((a,b)=>db[b].v-db[a].v).slice(0,5).reduce((s,x)=>s+Math.max(0,db[x].v-50)*.35,0)}}
async function sleeper(){const id=$('leagueId').value.trim();if(!id)throw Error('Enter a Sleeper league ID.');const[u,r,p]=await Promise.all([fetch(`https://api.sleeper.app/v1/league/${id}/users`),fetch(`https://api.sleeper.app/v1/league/${id}/rosters`),fetch('https://api.sleeper.app/v1/players/nfl')]);if(!u.ok||!r.ok||!p.ok)throw Error('Sleeper could not return that league.');const users=await u.json(),rosters=await r.json(),players=await p.json(),um=Object.fromEntries(users.map(x=>[x.user_id,x.metadata?.team_name||x.display_name||x.user_id])),out={};for(const x of rosters){out[um[x.owner_id]||`Roster ${x.roster_id}`]=(x.players||[]).map(id=>players[id]?.full_name).map(canon).filter(Boolean)}return out}function manual(){const out={};$('manual').value.split(/\n+/).forEach(line=>{const i=line.indexOf(':');if(i>0)out[line.slice(0,i).trim()]=line.slice(i+1).split(',').map(x=>canon(x.trim())).filter(Boolean)});if(Object.keys(out).length<2)throw Error('Add at least two teams.');return out}
function rank(values,v){return 1+values.filter(x=>x>v).length}function render(){const rows=Object.entries(teams).map(([name,r])=>{const l=lineup(r);return{name,r,...l,total:l.starter+l.bench}}).sort((a,b)=>b.total-a.total),bestTotal=rows[0]?.total||1;rows.forEach(x=>x.score=Math.round(100*x.total/bestTotal));let selected=rows[0]?.name||'';function draw(name){selected=name;const me=rows.find(x=>x.name===name),pos=['QB','RB','WR','TE','FLEX','STARTERS','BENCH'],metrics={};for(const p of ['QB','RB','WR','TE'])metrics[p]=me.r.filter(x=>db[x]?.pos===p).sort((a,b)=>db[b].v-db[a].v).slice(0,p==='RB'||p==='WR'?4:2).reduce((s,x)=>s+db[x].v,0);metrics.FLEX=Object.entries(me.out).filter(([k])=>k.startsWith('FLEX')).reduce((s,[,x])=>s+(db[x]?.v||0),0);metrics.STARTERS=me.starter;metrics.BENCH=me.bench;const all=Object.fromEntries(pos.map(p=>[p,rows.map(t=>p==='STARTERS'?t.starter:p==='BENCH'?t.bench:p==='FLEX'?Object.entries(t.out).filter(([k])=>k.startsWith('FLEX')).reduce((s,[,x])=>s+(db[x]?.v||0),0):t.r.filter(x=>db[x]?.pos===p).sort((a,b)=>db[b].v-db[a].v).slice(0,p==='RB'||p==='WR'?4:2).reduce((s,x)=>s+db[x].v,0))]));const slotRanks=slots.map(s=>{const v=db[me.out[s]]?.v||0,vals=rows.map(t=>db[t.out[s]]?.v||0);return[s,me.out[s]||'Empty',rank(vals,v)]});$('results').innerHTML=`<h2>Power rankings</h2><div style="overflow:auto"><table><thead><tr><th>RK</th><th>Team</th><th>Score</th><th>Starters</th><th>Bench</th></tr></thead><tbody>${rows.map((x,i)=>`<tr data-team="${x.name}" class="${x.name===name?'selected':''}"><td>${i+1}</td><td><b>${x.name}</b></td><td class="score">${x.score}</td><td>#${rank(rows.map(t=>t.starter),x.starter)}</td><td>#${rank(rows.map(t=>t.bench),x.bench)}</td></tr>`).join('')}</tbody></table></div><div class="details"><div><h2>${name}: positional ranks</h2><div class="bars">${pos.map(p=>{const r=rank(all[p],metrics[p]),pct=100*(rows.length-r+1)/rows.length,cl=r<=Math.ceil(rows.length/3)?'good':r>Math.ceil(rows.length*2/3)?'bad':'';return`<div class="barrow"><b>${p}</b><div class="track"><div class="fill ${cl}" style="width:${pct}%"></div></div><span>#${r}</span></div>`}).join('')}</div></div><div><h2>Starting-slot ranks</h2>${slotRanks.map(([s,n,r])=>`<div class="pill"><b>${s}</b>: ${n} — #${r}</div>`).join('')}<p class="muted">Scores use the optimal legal lineup plus discounted bench depth. The best roster is indexed to 100, matching the league-relative approach used by established analyzers.</p></div></div>`;$('results').querySelectorAll('tr[data-team]').forEach(tr=>tr.onclick=()=>draw(tr.dataset.team))}draw(selected)}
$('load').onclick=async()=>{try{if(!getDB())throw Error('The shared value engine is still loading. Try again in a moment.');$('status').textContent='Analyzing rosters…';teams=$('source').value==='manual'?manual():await sleeper();$('status').textContent=`Analyzed ${Object.keys(teams).length} teams using the shared hidden-value engine.`;render()}catch(e){$('status').textContent=e.message||'League import failed.'}};
</script></body></html>
