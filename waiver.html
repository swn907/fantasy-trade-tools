$('generate').onclick=()=>{offset=0;waiverRender(waiverBuild())};$('fresh').onclick=()=>{if(offset+15<allMoves.length){offset+=15;waiverRender(allMoves)}};$('previous').onclick=()=>{if(offset>0){offset=Math.max(0,offset-15);waiverRender(allMoves)}};
})();
</script></body></html>
